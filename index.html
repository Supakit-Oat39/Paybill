<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#BDEBD3" />
  <meta name="description" content="หารค่าใช้จ่ายในกลุ่มเพื่อน แยกรายการ เลือกคนร่วมจ่าย สรุปใครต้องโอนให้ใคร" />
  <title>หารบิล · Bill Splitter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2323855D'/%3E%3Cpath d='M20 16h24v34l-4-3-4 3-4-3-4 3-4-3-4 3z' fill='white'/%3E%3Cpath d='M26 26h12M26 33h12M26 40h7' stroke='%2323855D' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- ================= หน้า 1: รายการบิล ================= -->
    <main class="page" id="page-bills" data-page="bills" aria-labelledby="bills-title">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__logo" aria-hidden="true">🧾</span>
          <div>
            <p class="topbar__eyebrow">หารบิลกับเพื่อน</p>
            <h1 class="topbar__title" id="bills-title">รายการบิล</h1>
          </div>
        </div>
        <div class="topbar__actions">
          <button class="top-link" data-tab="summary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
            สรุปผล
          </button>
          <button class="icon-btn" data-action="open-menu" aria-label="เมนูข้อมูล: สำรอง กู้คืน ล้างข้อมูล">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
      </header>

      <section class="hero" aria-label="ภาพรวม">
        <div class="hero__top">
          <div>
            <p class="hero__amount"><span class="hero__currency">฿</span><span id="hero-total">0.00</span></p>
            <p class="hero__label">ยอดรวมค่าใช้จ่ายทั้งหมด</p>
          </div>
          <svg class="hero__art" viewBox="0 0 120 104" aria-hidden="true" style="stroke:none">
            <ellipse cx="62" cy="96" rx="48" ry="6" fill="#000" opacity=".06"/>
            <path d="M54 8h46a6 6 0 0 1 6 6v70l-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5L48 84V14a6 6 0 0 1 6-6z" fill="#fff"/>
            <rect x="58" y="22" width="30" height="5" rx="2.5" fill="#BDEBD3"/>
            <rect x="58" y="34" width="38" height="5" rx="2.5" fill="#CDE7FB"/>
            <rect x="58" y="46" width="24" height="5" rx="2.5" fill="#CDE7FB"/>
            <rect x="58" y="60" width="38" height="7" rx="3.5" fill="#23855D" opacity=".85"/>
            <g>
              <ellipse cx="30" cy="88" rx="20" ry="7" fill="#F2C35B"/>
              <rect x="10" y="78" width="40" height="10" fill="#F7D47E"/>
              <ellipse cx="30" cy="78" rx="20" ry="7" fill="#FFE3A3"/>
              <rect x="10" y="68" width="40" height="10" fill="#F7D47E"/>
              <ellipse cx="30" cy="68" rx="20" ry="7" fill="#FFE9B8"/>
              <text x="30" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#C9962E" font-family="Nunito, sans-serif">฿</text>
            </g>
            <circle cx="104" cy="92" r="9" fill="#FFD0BD"/>
            <path d="M104 88.5c-1.6-2.4-5.2-1-4.3 1.6.6 1.8 4.3 4.6 4.3 4.6s3.7-2.8 4.3-4.6c.9-2.6-2.7-4-4.3-1.6z" fill="#E8735A"/>
          </svg>
        </div>
        <div class="hero__stats">
          <span>👥 <strong id="hero-members">0</strong> สมาชิก</span>
          <span>🧾 <strong id="hero-items">0</strong> รายการ</span>
        </div>
        <div class="hero__actions">
          <button class="btn btn--light" data-action="add-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            เพิ่มรายการ
          </button>
        </div>
      </section>

      <div class="notice" id="storage-notice" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
        <p>ข้อมูลถูกบันทึกอัตโนมัติไว้ใน<strong>เบราว์เซอร์และอุปกรณ์นี้เท่านั้น</strong> ไม่ซิงก์ไปเครื่องอื่น และอาจหายถ้าล้างข้อมูลเว็บไซต์ ควร<button class="link" data-action="export">ส่งออกไฟล์สำรอง</button>เป็นระยะ</p>
        <button class="icon-btn icon-btn--sm" data-action="dismiss-notice" aria-label="ปิดข้อความแจ้งเตือน">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <section class="section" aria-labelledby="members-title">
        <div class="section__head">
          <h2 id="members-title">สมาชิก <span class="count" id="members-count">0</span></h2>
          <div class="section__tools">
          <button class="btn-clear" data-action="clear-members" id="clear-members" aria-label="ล้างสมาชิกทั้งหมด" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>ล้าง</button>
          <button class="btn btn--soft btn--sm" data-action="add-member">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            เพิ่มสมาชิก
          </button>
          </div>
        </div>
        <div class="members" id="members-list"></div>
      </section>

      <section class="section" aria-labelledby="items-title">
        <div class="section__head">
          <h2 id="items-title">รายการค่าใช้จ่าย <span class="count" id="items-count">0</span></h2>
          <div class="section__tools">
          <button class="btn-clear" data-action="clear-items" id="clear-items" aria-label="ล้างรายการค่าใช้จ่ายทั้งหมด" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>ล้าง</button>
          <button class="btn btn--soft btn--sm" data-action="add-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            เพิ่มรายการ
          </button>
          </div>
        </div>
        <div class="items" id="items-list"></div>
      </section>

    </main>

    <!-- ================= หน้า 2: สรุปและคำนวณ ================= -->
    <main class="page" id="page-summary" data-page="summary" aria-labelledby="summary-title" hidden>
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__logo" aria-hidden="true" style="background:var(--sky)">📊</span>
          <div>
            <p class="topbar__eyebrow">ใครต้องโอนให้ใคร</p>
            <h1 class="topbar__title" id="summary-title">สรุปและคำนวณ</h1>
          </div>
        </div>
        <button class="icon-btn" data-action="open-menu" aria-label="เมนูข้อมูล: สำรอง กู้คืน ล้างข้อมูล">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </header>
      <div id="summary-content"></div>
    </main>

    <!-- ================= เมนูด้านล่าง ================= -->
    <nav class="tabbar" aria-label="เมนูหลัก">
      <button class="tab is-active" data-tab="bills" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2.5-1.8L13 21l-2.5-1.8L8 21l-2-1.5z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        <span>รายการบิล</span>
      </button>
      <button class="fab" data-action="add-item" aria-label="เพิ่มรายการค่าใช้จ่าย">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="summary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>สรุปผล</span>
      </button>
    </nav>
  </div>

  <!-- Sheet / Dialog containers -->
  <div class="sheet-root" id="sheet-root"></div>
  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script type="module" src="js/app.js"></script>
</body>
</html>
